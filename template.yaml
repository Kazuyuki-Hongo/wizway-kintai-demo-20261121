AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 勤怠デモ - React + Python Lambda + SQLite + API Gateway + S3 + CloudFront

Globals:
  Function:
    Timeout: 10
    Runtime: python3.13
    Architectures:
      - x86_64
    MemorySize: 128

Resources:
  KintaiHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - PUT
          - POST
          - OPTIONS

  KintaiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      CodeUri: backend/
      Handler: app.lambda_handler
      Description: 勤怠デモ API（共有 SQLite）
      Environment:
        Variables:
          KINTAI_DB_BUCKET: !Ref DemoDbBucket
          KINTAI_DB_KEY: attendance.db
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DemoDbBucket
        - S3WritePolicy:
            BucketName: !Ref DemoDbBucket
      Events:
        EmployeesGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /employees
            Method: GET
        MonthGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /employees/{id}/months/{ym}
            Method: GET
        SummaryGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /employees/{id}/months/{ym}/summary
            Method: GET
        DayPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /employees/{id}/months/{ym}/days/{date}
            Method: PUT
        OverviewGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /months/{ym}/overview
            Method: GET
        ExportGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /months/{ym}/export
            Method: GET
        LoginPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /login
            Method: POST
        LogoutPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /logout
            Method: POST
        DemoErrorGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /demo/error
            Method: GET
        DemoUnimplementedGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref KintaiHttpApi
            Path: /demo/unimplemented
            Method: GET

  DemoDbBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-db-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AWS::StackName}-frontend-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-frontend-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

Outputs:
  ApiUrl:
    Description: API base URL
    Value: !Sub 'https://${KintaiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
  EmployeesEndpoint:
    Description: GET /employees
    Value: !Sub 'https://${KintaiHttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod/employees'
  FrontendBucketName:
    Description: S3 bucket for React build
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: CloudFront URL
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for cache invalidation)
    Value: !Ref FrontendDistribution
